[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lumen-organizer"
version = "0.1.0"
description = "Local validation and confirmed import of Lumen Markdown notes"
requires-python = ">=3.12"
dependencies = ["PyYAML>=6.0.2,<7", "youtube-transcript-api==1.2.4", "pypdf==6.12.0"]

[tool.setuptools.packages.find]
where = ["src"]
